openapi: "3.0.3"
info:
  title: Tivoli Centralbank API
  version: "1.0.0"
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: >
    Central bank API for the Tivoli amusement park. Handles users, groups,
    amusement registration, transactions, stamps, exchanges, voting, and
    the end-of-showdown leaderboard.

    ## Authentication

    **Users** authenticate with `Authorization: Bearer <jwt>` obtained from
    `POST /auth/login` using first name and startcode. Startcodes are stored
    hashed (bcrypt) and compared in constant time — they are never stored or
    logged in plaintext. The JWT contains `uuid`, `first_name`, and
    `group_id`, signed with HS256 and valid for **24 hours** from issuance.

    **Amusements** authenticate with `X-Api-Key: <key>`. Each amusement gets
    a unique API key when registered. Use this key for transaction endpoints
    (`POST /transactions`, `POST /transactions/{id}/payout`). To act on behalf
    of a user, pass their `user_uuid` in the request body.

    ## First login

    Users are seeded with a `null` balance and no `logged_in_at` timestamp.
    On the user's first successful login, their balance is set to **€25** and
    `logged_in_at` is recorded. Subsequent logins never touch the balance.

    ## Key concepts

    ### Stamps
    Each transaction (game play *or* attraction visit) rewards the user with
    a random stamp as a participation trophy: one of five animals (lion,
    dolphin, tucan, beetlebug, snake) with a 50% chance of a metal tier
    (silver, gold, platinum). Stamps are generated server-side by the central
    bank.

    ### Exchanges vs VP
    You can exchange stamp sets for cash *or* save them to earn Victory Points
    (VP) on the final leaderboard. Exchanged stamps are consumed and cannot be
    used for VP. Choose wisely.

    ### Revenue
    Money from games and attractions flows into the amusement's pooled balance.
    At the end of showdown, `POST /settle` is called **once**. It zeros every
    amusement's balance and distributes the profit (or debt) equally among
    its group members' personal balances.

    ### User flow (amusements)
    1. User clicks a link in the Tivoli frontend and is redirected to the
       amusement with `?token=<jwt>`. Note: the token will appear in browser
       history. The JWT contains the user's UUID, name, and group.
    2. Amusement extracts `user_uuid` from the JWT.
    3. Amusement calls `POST /transactions` with `{ user_uuid, amount }`.
    4. Central bank deducts the amount from the user, credits the amusement,
       generates a random stamp, and returns `{ id, stamp }`.
    5. Amusement runs its own game logic.
    6. If the user wins, amusement calls `POST /transactions/{id}/payout`
       with `{ amount }`. Central bank deducts from the amusement and credits
       the user.

    For attractions (rides), only step 3 is needed — no payout.

servers:
  - url: http://localhost:8000/api
    description: Local development

tags:
  - name: Auth
    description: Login and JWT issuance.
  - name: User
    description: Current user profile and updates.
  - name: Groups
    description: Groups of users that collectively own amusements.
  - name: Amusements
    description: Games and attractions registered in the park.
  - name: Transactions
    description: Amusement-initiated money movement (charge and payout).
  - name: Stamps
    description: Stamp collection and exchanging sets for cash.
  - name: Votes
    description: User voting for the nicest amusement.
  - name: Results
    description: End-of-showdown settlement and final leaderboard.

paths:

  # ── Auth ───────────────────────────────────────────────────────────────

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with first name and startcode
      description: >
        Returns a JWT valid for 24 hours. On the user's first-ever successful
        login, their balance is initialized to €25 (see "First login" in the
        intro). Startcodes are checked against a bcrypt hash. The JWT payload
        contains `uuid`, `first_name`, and `group_id`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, startcode]
              properties:
                first_name:
                  type: string
                  example: "Amin"
                startcode:
                  type: string
                  example: "abc123"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT. Contains uuid, first_name, group_id.
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── User ───────────────────────────────────────────────────────────────

  /me:
    get:
      tags: [User]
      operationId: getMe
      summary: Current user profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: User profile including balance, group, and stamp count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      tags: [User]
      operationId: updateMe
      summary: Update profile information
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                last_name:
                  type: string
                  nullable: true
                github_url:
                  type: string
                  format: uri
                  nullable: true
                  example: "https://github.com/amin"
                website_url:
                  type: string
                  format: uri
                  nullable: true
                  example: "https://amin.dev"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ── Groups ─────────────────────────────────────────────────────────────

  /groups:
    get:
      tags: [Groups]
      operationId: listGroups
      summary: List all groups
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: All groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/GroupSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /groups/{id}:
    get:
      tags: [Groups]
      operationId: getGroup
      summary: Single group with members and amusements
      description: >
        If the requesting user belongs to this group, each amusement includes
        its `api_key`. Non-members receive amusements without `api_key`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Amusements ─────────────────────────────────────────────────────────

  /amusements:
    get:
      tags: [Amusements]
      operationId: listAmusements
      summary: List all amusements
      description: >
        Returns all registered amusements. `api_key` is never included in
        this public listing.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: All registered amusements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Amusement"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Amusements]
      operationId: createAmusement
      summary: Register a new amusement
      description: >
        The amusement is automatically linked to the requesting user's group.
        Returns the `api_key` — save it, it is only shown once in this response.
        To retrieve the key later, use `GET /groups/{id}` (group members only).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, url]
              properties:
                name:
                  type: string
                  example: "Fortune Wheel"
                description:
                  type: string
                  nullable: true
                  example: "Spin the wheel and test your luck"
                type:
                  type: string
                  enum: [game, attraction]
                url:
                  type: string
                  format: uri
                  example: "https://fortune.example.com"
      responses:
        "201":
          description: >
            Amusement registered. The response always includes `api_key` —
            save it, it is only shown in this response. To retrieve the key
            later, use `GET /groups/{id}` (group members only).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Amusement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /amusements/{id}:
    get:
      tags: [Amusements]
      operationId: getAmusement
      summary: Single amusement detail
      description: >
        If the requesting user belongs to the amusement's group, the response
        includes `api_key`. Otherwise it is omitted.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AmusementId"
      responses:
        "200":
          description: Amusement detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Amusement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Amusements]
      operationId: updateAmusement
      summary: Update an amusement
      description: Any member of the amusement's group can update it.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AmusementId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                type:
                  type: string
                  enum: [game, attraction]
                url:
                  type: string
                  format: uri
      responses:
        "200":
          description: Updated amusement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Amusement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags: [Amusements]
      operationId: deleteAmusement
      summary: Delete an amusement
      description: >
        Any member of the amusement's group can delete it. Deletion is
        blocked if the amusement has a non-zero balance — settle first.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AmusementId"
      responses:
        "204":
          description: Amusement deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot delete amusement with non-zero balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  message: "Cannot delete amusement with balance €15.00. Settle first."

  /amusements/{id}/regenerate-key:
    post:
      tags: [Amusements]
      operationId: regenerateAmusementKey
      summary: Rotate the amusement's API key
      description: >
        Invalidates the old key and returns a new one. Any member of the
        amusement's group can do this.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AmusementId"
      responses:
        "200":
          description: New API key generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
                    example: "tiv_xyz789ghi012"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Transactions ───────────────────────────────────────────────────────

  /transactions:
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Deduct money from a user and award a stamp
      description: >
        Used when a user plays a game or visits an attraction. The amusement's
        balance is credited. A random stamp is generated and returned.

        The returned `id` is required for `POST /transactions/{id}/payout` if
        the user wins.
      security: [{ apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_uuid, amount]
              properties:
                user_uuid:
                  type: string
                  format: uuid
                  description: UUID of the user (extracted from the JWT)
                amount:
                  type: number
                  multipleOf: 0.01
                  minimum: 0.01
                  description: Amount to deduct in euros (2-decimal precision).
                  example: 19.95
      responses:
        "201":
          description: Money deducted and stamp awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: User has insufficient funds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  message: "Insufficient funds. Balance: €3.00, required: €5.00"
        "404":
          $ref: "#/components/responses/NotFound"

  /transactions/{id}/payout:
    post:
      tags: [Transactions]
      operationId: payoutTransaction
      summary: Pay winnings to a user from the amusement's balance
      description: >
        Called after the user wins a game. Deducts from the amusement's balance
        and credits the user. The transaction is marked as settled — double
        payout is rejected.

        The API key must belong to the same amusement that created the
        original transaction. Attractions (`type: attraction`) are rejected
        — only games can pay out.
      security: [{ apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  multipleOf: 0.01
                  minimum: 0.01
                  description: Winnings to pay out in euros (2-decimal precision).
                  example: 10.00
      responses:
        "200":
          description: Payout completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Payout successful"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Amusement has insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  message: "Insufficient amusement balance. Balance: €2.00, required: €10.00"
        "403":
          description: API key does not match the transaction's amusement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  message: "This transaction belongs to a different amusement"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Conflict — either the transaction has already been paid out, or
            the amusement is an attraction (attractions cannot pay out).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  message: "Transaction #42 has already been paid out"

  # ── Stamps ─────────────────────────────────────────────────────────────

  /stamps:
    get:
      tags: [Stamps]
      operationId: listStamps
      summary: Get current user's unexchanged stamps
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: User's stamp collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Stamp"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exchanges:
    post:
      tags: [Stamps]
      operationId: exchangeStamps
      summary: Exchange stamp sets for money
      description: >
        Submit stamp IDs. The server forms sets greedily in this order,
        picking the highest-value sets first:

        1. **Metal sets** (silver + gold + platinum, any animals) — €10 each
        2. **Animal sets** (all five animals, any metals) — €7 each
        3. **Non-metal sets** (3 distinct animals with no metal) — €3 each

        Only stamps that end up in a formed set are consumed; stamps left
        over stay in the user's collection and remain eligible for Victory
        Points. This means you can safely submit your entire collection and
        let the server take only what pays.

        Money is created out of thin air — exchanges do not affect any
        amusement's balance.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stamp_ids]
              properties:
                stamp_ids:
                  type: array
                  minItems: 1
                  items:
                    type: integer
                  example: [1, 2, 3, 4, 5, 6, 7]
      responses:
        "200":
          description: Exchange result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: >
            Validation failed, or one or more stamp IDs do not belong to
            the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  message: "One or more stamp IDs do not belong to you"

  # ── Votes ──────────────────────────────────────────────────────────────

  /votes:
    post:
      tags: [Votes]
      operationId: castVote
      summary: Vote for the nicest amusement
      description: >
        One vote per user. Voting again replaces your previous vote (upsert).
        Users are free to vote for amusements in their own group.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amusement_id]
              properties:
                amusement_id:
                  type: integer
                  example: 3
      responses:
        "201":
          description: Vote recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Vote recorded"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Amusement not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ── Settlement ─────────────────────────────────────────────────────────

  /settle:
    post:
      tags: [Results]
      operationId: settle
      summary: End of showdown settlement
      description: >
        Called **once** at the end of the showdown. For each amusement:

        1. Take the amusement's current balance (positive = profit,
           negative = debt).
        2. Split it equally among the members of the amusement's group and
           apply the split to each member's personal balance — profit is
           credited, debt is debited.
        3. Zero the amusement's balance.

        After settlement, all amusement balances are zero and the surplus
        or debt has been absorbed by the group members.

        Calling this endpoint is intended to happen exactly once. Calling
        it again would settle zero-balance amusements, which is a no-op.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Settlement results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Leaderboard ────────────────────────────────────────────────────────

  /leaderboard:
    get:
      tags: [Results]
      operationId: getLeaderboard
      summary: Final leaderboard
      description: >
        Top 10 in each category.

        **Rankings:**
        - **Richest**: users ordered by personal balance (descending).
        - **Most VP**: users ordered by Victory Points (descending).
        - **Nicest amusements**: amusements ordered by vote count (descending).

        **VP calculation (partition, metal first):**
        1. `metal_sets = min(silver_count, gold_count, platinum_count)` →
           `40 × metal_sets` VP. Reserves 3 × metal_sets stamps (one of each
           metal per set).
        2. From the remaining stamps,
           `animal_sets = min(count of each of the five animals)` →
           `25 × animal_sets` VP. Reserves 5 × animal_sets stamps.
        3. `loose = remaining stamps after both partitions`. VP awarded as
           the `loose`-th triangular number
           (1 → 1, 2 → 3, 3 → 6, 4 → 10, …).
        4. Total VP is the sum of the three.

        Only unexchanged stamps are counted. Stamps are never deleted by
        this endpoint — the partition is purely arithmetic.

        **Tie-breaking** in all three rankings: lower `id` (or earliest
        creation) wins.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Leaderboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
        "401":
          $ref: "#/components/responses/Unauthorized"

# ── Components ───────────────────────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        HS256-signed JWT obtained from `POST /auth/login`, valid for 24 hours.
        Contains `uuid`, `first_name`, and `group_id`.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >
        API key obtained when registering an amusement. Also visible to group
        members via `GET /groups/{id}`.

  parameters:
    GroupId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    AmusementId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    TransactionId:
      name: id
      in: path
      required: true
      description: ID of the original transaction (from `POST /transactions`).
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not a member of this amusement's group
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "The name field is required."
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string

  schemas:

    # ── User ─────────────────────────────────────────────────────────

    User:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          example: "Amin"
        last_name:
          type: string
          nullable: true
          example: null
        github_url:
          type: string
          format: uri
          nullable: true
          example: "https://github.com/amin"
        website_url:
          type: string
          format: uri
          nullable: true
          example: null
        balance:
          type: number
          multipleOf: 0.01
          example: 25.00
          readOnly: true
        group:
          allOf:
            - $ref: "#/components/schemas/GroupSummary"
          readOnly: true
        stamp_count:
          type: integer
          example: 4
          readOnly: true

    UserSummary:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
          nullable: true
        github_url:
          type: string
          format: uri
          nullable: true
        website_url:
          type: string
          format: uri
          nullable: true

    # ── Group ───────────────────────────────────────────────────────

    GroupSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: "Centralbank"
        member_count:
          type: integer
          example: 3

    Group:
      allOf:
        - $ref: "#/components/schemas/GroupSummary"
        - type: object
          properties:
            total_balance:
              type: number
              multipleOf: 0.01
              description: Sum of all amusement balances belonging to this group.
              example: 45.00
            members:
              type: array
              items:
                $ref: "#/components/schemas/UserSummary"
            amusements:
              type: array
              items:
                $ref: "#/components/schemas/Amusement"

    # ── Amusement ───────────────────────────────────────────────────

    Amusement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          example: "Fortune Wheel"
        description:
          type: string
          nullable: true
        type:
          type: string
          enum: [game, attraction]
        url:
          type: string
          format: uri
          example: "https://fortune.example.com"
        balance:
          type: number
          multipleOf: 0.01
          description: Current pooled balance of this amusement.
          example: 15.50
          readOnly: true
        api_key:
          type: string
          description: >
            Only included for group members (via `GET /groups/{id}` or
            `GET /amusements/{id}`). Never exposed in public listings.
          example: "tiv_abc123def456"
        group:
          allOf:
            - $ref: "#/components/schemas/GroupSummary"
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    # ── Stamp ───────────────────────────────────────────────────────

    Stamp:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        animal:
          type: string
          enum: [lion, dolphin, tucan, beetlebug, snake]
          example: "dolphin"
        metal:
          type: string
          enum: [silver, gold, platinum]
          nullable: true
          example: "gold"
        source_amusement_id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    # ── Transaction ─────────────────────────────────────────────────

    TransactionResponse:
      type: object
      properties:
        id:
          type: integer
          description: Transaction ID. Save this — it is required for payout.
        stamp:
          $ref: "#/components/schemas/Stamp"

    # ── Exchange ───────────────────────────────────────────────────

    ExchangeResponse:
      type: object
      properties:
        amount:
          type: number
          multipleOf: 0.01
          description: Total euros received from this exchange.
          example: 10.00
        sets_exchanged:
          type: object
          properties:
            metal_sets:
              type: integer
              description: Number of 3-metal sets found (€10 each).
              example: 1
            animal_sets:
              type: integer
              description: Number of 5-animal sets found (€7 each).
              example: 0
            non_metal_sets:
              type: integer
              description: Number of 3-distinct-non-metal-animal sets found (€3 each).
              example: 0
        stamps_consumed:
          type: integer
          description: >
            Count of submitted stamps that were used by the greedy set
            formation. Stamps not used are left in the user's collection.
          example: 3

    # ── Settlement ─────────────────────────────────────────────────

    SettlementResponse:
      type: object
      properties:
        amusements_settled:
          type: integer
          description: Number of amusements settled in this call.
          example: 12
        details:
          type: array
          items:
            type: object
            properties:
              amusement_id:
                type: integer
              amusement_name:
                type: string
              balance:
                type: number
                multipleOf: 0.01
                description: Balance before split (positive = profit, negative = debt).
              split_per_member:
                type: number
                multipleOf: 0.01
                description: Amount each group member received (or paid).
              member_count:
                type: integer

    # ── Leaderboard ─────────────────────────────────────────────────

    Leaderboard:
      type: object
      properties:
        richest:
          type: array
          items:
            type: object
            properties:
              user:
                $ref: "#/components/schemas/UserSummary"
              balance:
                type: number
                multipleOf: 0.01
        most_vp:
          type: array
          items:
            type: object
            properties:
              user:
                $ref: "#/components/schemas/UserSummary"
              vp:
                type: integer
                description: Total Victory Points
        nicest_amusements:
          type: array
          items:
            type: object
            properties:
              amusement:
                $ref: "#/components/schemas/Amusement"
              votes:
                type: integer

    # ── Error ───────────────────────────────────────────────────────

    Error:
      type: object
      properties:
        message:
          type: string
